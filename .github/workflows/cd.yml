# Pipeline de Entrega Continua (CD)
# Roda depois do merge do PR (push na branch principal):
#   Testes -> Publicar imagem (GitHub Container Registry)
#
# Nao precisa cadastrar segredo: o login no ghcr.io usa o GITHUB_TOKEN automatico.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # botao "Run workflow" na aba Actions

permissions:
  contents: read

jobs:
  testes:
    name: 1. Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Testes unitarios
        run: node --test --experimental-test-coverage "tests/unit/**/*.test.*"
      - name: Preparar o banco de dados
        run: psql "postgresql://app:app@localhost:5432/app_test" -f db/migrations/001_criar_tabelas.sql
      - name: Testes de integracao
        run: node --test "tests/integration/**/*.test.*"

  publicar-imagem:
    name: 2. Publicar imagem
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # permissao para publicar no ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gerar nome e tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
